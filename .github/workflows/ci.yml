name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# ---------------------------------------------------------------------------
# Native binary strategy
# ---------------------------------------------------------------------------
# Several packages ship platform-specific native .node addons as optional npm
# dependencies (e.g. @tailwindcss/oxide, @ast-grep/napi, @rolldown/binding,
# lightningcss, @next/swc-*). npm resolves optional deps at install time based
# on the current OS/CPU, so a lockfile generated on Windows only contains the
# Windows variants. When `npm ci` runs on Ubuntu those packages are absent,
# causing "Cannot find native binding" build failures.
#
# Fix (two-layer defence):
#   1. Root .npmrc sets `os=any cpu=any` — the NEXT `npm install` run (e.g. by
#      a dev or a Dependabot bump) will regenerate the lockfile with ALL
#      platform variants included, making `npm ci` work everywhere from then on.
#   2. Every job below runs a "fix native bindings" step after `npm ci` that
#      installs the known Linux x64 packages with --no-save as a safety net.
#      This step is idempotent: if the lockfile already has them it's a no-op.
# ---------------------------------------------------------------------------

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fix native bindings for Linux (npm optional-dep bug workaround)
        # Installs Linux-x64 native addons that are absent when the lockfile was
        # generated on Windows/macOS. --no-save keeps package.json/lockfile clean.
        run: |
          npm install --no-save \
            @ast-grep/napi-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu

      - name: Lint (web)
        run: npm run lint --workspace=apps/web --if-present

      - name: Type check (api)
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Type check (web)
        run: npx tsc --noEmit
        working-directory: apps/web

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fix native bindings for Linux (npm optional-dep bug workaround)
        run: |
          npm install --no-save \
            @ast-grep/napi-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu

      - name: Run API tests
        run: npx vitest run --reporter=verbose
        working-directory: apps/api

  build-and-deploy:
    name: Build & Deploy
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fix native bindings for Linux (npm optional-dep bug workaround)
        run: |
          npm install --no-save \
            @ast-grep/napi-linux-x64-gnu \
            @tailwindcss/oxide-linux-x64-gnu \
            @rolldown/binding-linux-x64-gnu \
            lightningcss-linux-x64-gnu

      - name: Build & Deploy API to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Web (OpenNext for Cloudflare)
        run: node scripts/build-worker.js
        working-directory: apps/web
        env:
          BUILD_WORKER: "1"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}

      - name: Deploy Web to Cloudflare Workers
        run: npx @opennextjs/cloudflare deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
