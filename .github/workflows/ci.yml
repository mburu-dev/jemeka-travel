name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint --if-present

    - name: Type Check
      run: npx tsc --noEmit

    - name: Test
      run: npm test

    - name: Build API
      run: npm run build --workspace=apps/api

    - name: Deploy API to Cloudflare Workers
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: npm run deploy:worker --workspace=apps/api
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Build Web (OpenNext for Cloudflare)
      run: cross-env BUILD_WORKER=1 npm run build:worker --workspace=apps/web
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    - name: Deploy Web to Cloudflare Workers
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      run: npm run deploy:worker --workspace=apps/web
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
