services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jemeka-web
    restart: unless-stopped
    ports:
      # Local port mapping for testing without Cloudflare Tunnel
      # In production, Cloudflare connects directly to this container via Docker network
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jemeka-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - jemeka_data:/data/db
    environment:
      - NODE_ENV=production
      - DB_FILE=file:/data/db/sqlite.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jemeka-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
      - api

volumes:
  jemeka_data:
